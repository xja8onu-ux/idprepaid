<!-- साउंड फाइल लोड करना (इसे छुपा कर रखा है) -->
<audio id="beatSound" src="kick-drum.mp3"></audio>

<!-- बटन जिस पर क्लिक करने से बीट बजेगी -->
<button onclick="playBeat()">Play Beat 🥁</button>

<script>
function playBeat() {
  var audio = document.getElementById("beatSound");
  
  // अगर साउंड पहले से चल रहा है, तो उसे रीसेट करके दोबारा शुरू से बजाएं
  audio.currentTime = 0; 
  audio.play();
}
</script>
