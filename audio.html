<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Test</title>
</head>
<body>

    <h3>1. बैकग्राउंड म्यूज़िक प्लेयर (प्ले बटन दबाकर देखें):</h3>
    <!-- इसमें इंटरनेट की एक असली ऑडियो फाइल का लिंक डाला है -->
    <audio controls loop>
      <source src="https://soundhelix.com" type="audio/mpeg">
      आपका ब्राउज़र इस ऑडियो को सपोर्ट नहीं करता है।
    </audio>

    <br><br><br>

    <h3>2. बीट बटन (क्लिक करते ही तुरंत आवाज़ आएगी):</h3>
    <!-- इसमें एक असली ड्रम/शॉट साउंड का लिंक है -->
    <audio id="beatSound" src="https://google.com"></audio>
    <button onclick="playBeat()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
        Play Beat 🥁
    </button>

    <script>
    function playBeat() {
      var audio = document.getElementById("beatSound");
      audio.currentTime = 0; // साउंड को शुरू से रीसेट करने के लिए
      audio.play();
    }
    </script>

</body>
</html>
